services:
  reels-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reels-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Монтирование .env для смены настроек прямо из админ-панели Telegram
      - ./.env:/app/.env
      # Монтирование кода бота и git для авто-обновления по кнопке
      - ./bot:/app/bot
      - ./.git:/app/.git
      # Сохранение базы данных между перезапусками контейнера
      - ./data:/app/data
      # Монтирование ключа Google Service Account
      - ./credentials:/app/credentials:ro
      # Временная папка для скачивания
      - ./downloads:/app/downloads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
